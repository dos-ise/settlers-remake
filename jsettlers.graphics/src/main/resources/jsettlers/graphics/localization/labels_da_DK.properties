tutorial-task-0 = Du kan forlade denne tutorial-mission når som helst via computerikonet nederst til venstre.\n\nTårnet i midten er dit startpunkt. Et par bosættere, soldater og byggematerialer ligger klar på engene.
tutorial-task-1 = Hold højre museknap nede og bevæg musen for at flytte kortet.\n\nFør du fortsætter, bør du vende tilbage til dit starttårn.
tutorial-task-2 = For at udvinde råstoffer har du brug for en byggeøkonomi, der producerer brædder og sten.\n\nByg først en skovhuggerhytte:\n- Åbn byggemenuen øverst til venstre (husikonet).\n- Klik på kontakten "Bygninger til råstoffer".\n- Vælg skovhuggerhytten. Der vises farvede prikker på banen.\n- Jo grønnere prikken er, desto hurtigere bygges der.\n\nPlacer hytten på en grøn prik nord for skoven.
tutorial-task-3 = For at forvandle træstammerne til brædder har du brug for et savværk.\n\nDu finder det i samme menu som skovhuggeren. Hold musen over et ikon for at se navnet.\n- Klik på savværket.\n- Placer det på en grøn eller gul prik nordøst for skovhuggerhytten.
tutorial-task-4 = Du har ikke kun brug for brædder, men også sten til at bygge.\n\nOpfør derfor en stenhuggerhytte vest for stenmarken i øst.
tutorial-task-5 = For at udvide og beskytte dit territorium skal du bygge vagttårne.\n- Åbn menuen "Militære bygninger" (tårnikonet).\n- Klik på vagttårnets ikon.\n- Byg et helt i vest, et i nord og et i øst.\n\nSå snart et tårn er færdigt, vil en sværdkæmper besætte tårnet, og dit territorium udvides.
tutorial-task-6 = For at få flere bosættere skal du bygge beboelseshuse.\n- Åbn menuen "Forskellige bygninger".\n- Opfør et lille beboelseshus syd for dit starttårn.\n\nFor at din skovhugger ikke løber tør for træer, skal du bygge et skovhus sydvest for ham (menu "Bygninger til råstoffer").\n\nLidt vest for skovhuset følger en anden skovhuggerhytte.\n\nEn skovfoged planter nok træer til to skovhuggere.
tutorial-task-7 = I nord er et bjergområde kommet ind i dit synsfelt gennem landudvidelsen.\n\nRekrutter 5 geologer:\n- Åbn menuen BOSÆTTERE / ERHVERVSVALG.\n- Klik på dobbeltpilen ved specialisten øverst til venstre.\n- Træk en ramme omkring de fem geologer med venstre museknap.\n\nSend geologerne ind i bjergene. Kun på klippefyldt undergrund finder de råstoffer.\n\nKlik på "Søg råstoffer" til venstre, og lad dem undersøge bjerget, indtil de har fundet jernmalm (sølvfarvede symboler) og kul (sorte symboler).\n\nByg miner ved de punkter med flest symboler (menu "Bygninger til råstoffer").
tutorial-task-8 = Byg en jernsmelte, en værktøjssmedje og en våbensmedje i nærheden af bjerget.\n\nHer er korte leveringsveje vigtigere end byggetiden – brug også røde felter.\n\nTil de næste byggeprojekter har du brug for flere bosættere: Byg endnu et beboelseshus, hvis muligt et mellemstort, vest for det lille beboelseshus.\n\nVåbensmedjen arbejder automatisk. Værktøj fremstiller du via menuen "Varer og værktøj / Værktøj og våben".
tutorial-task-9 = Dine minearbejdere har brug for en fødevareindustri. I øst er der plads nok til det.\n\nDele: kornfarm, svinefarm, slagteri, vandværk.\n\n- Byg kornfarmen. Landmanden har brug for fladt, grønt land syd for sin farm.\n- Lige ved siden af kommer svinefarmen – ikke på dyrkningsarealet.\n- Slagteriet står i direkte linje mellem svinefarmen og minerne.\n- Find floden i vest. Vandværket skal stå ved rindende vand.\n\nMarkér vandværket, og klik på kontakten med de orange-grønne cirkler. Arbejdsområdet skal omfatte rindende vand.
tutorial-task-10 = Den anden del af fødevareindustrien er brødproduktionen.\n\nVagttårnet helt i øst blokerer frugtbart agerland:\n- Markér tårnet.\n- Klik på "Riv bygning ned" (helt øverst til højre i byggemenuen).\n- Bekræft med "Ja".\n\nByg derefter en anden kornfarm, en vindmølle og et bageri i nærheden af minerne.
tutorial-task-11 = Nu bør du rekruttere soldater. Dertil har du brug for en kaserne ved vestgrænsen.\n\nNår den er færdig, leveres der våben til den, som kamplystne bosættere snupper og bliver til soldater.\n\nFor nok soldater har du brug for flere indbyggere: Byg endnu et mellemstort beboelseshus øst for det lille beboelseshus.
tutorial-task-12 = Er du interesseret i, hvad der gemmer sig i verdens mørke? Så rekrutter en tyv.\n\nEn tyv rekrutterer du der, hvor du også rekrutterer geologer:\n- Klik på den enkelte pil ved specialisten nederst til venstre.\n- Du har brug for frie bærere på skærmen.\n\nSend tyven mod nord, og se hvordan krigstågen letter.\n\nHan skal være forsigtig: For tæt på fjendtlige soldater ville han blive opdaget og uskadeliggjort.\n\nPrøv at finde fjendens tårn.
tutorial-task-13 = Før du angriber, skal du udvide dit territorium mod vest, indtil dine grænser omfatter guldbarren. Guld styrker dine soldaters kampkraft på fjendtligt område.\n\nHvis et vagttårn ikke er besat, så send en sværdkæmper derhen. Besatte tårne kan du rive ned igen for at frigøre en sværdkæmper.\n\nRekrutter mindst 15 soldater, og march mod nord til fjendens tårn.\n\nNår alle krigere er ankommet (bueskytter går langsommere) og er markeret, så klik med højre museknap på fjendens tårn.
tutorial-task-14 = Tillykke. Du er virkelig en af de udvalgte.\n\nNu er du klar til at erobre verden. Held og lykke. Du får brug for det.\n\nKlik på computerikonet i nederste venstre hjørne.\n\nGod fornøjelse!
