tutorial-task-0 = Puedes abandonar esta misión de tutorial en cualquier momento mediante el icono de ordenador en la parte inferior izquierda.\n\nLa torre del centro es tu punto de partida. Unos pocos colonos, soldados y materiales de construcción están listos en el prado.
tutorial-task-1 = Mantén pulsado el botón derecho del ratón y mueve el ratón para desplazar el mapa.\n\nAntes de continuar, deberías volver a tu torre de partida.
tutorial-task-2 = Para extraer recursos necesitas una economía de construcción que produzca tablones y piedras.\n\nConstruye primero una cabaña de leñador:\n- Abre el menú de edificios arriba a la izquierda (icono de casa).\n- Haz clic en el interruptor "Edificios para recursos".\n- Selecciona la cabaña de leñador. Aparecen puntos de colores en el campo.\n- Cuanto más verde sea el punto, más rápido se construirá.\n\nColoca la cabaña en un punto verde al norte del bosque.
tutorial-task-3 = Para convertir los troncos en tablones necesitas un aserradero.\n\nLo encontrarás en el mismo menú que el leñador. Pasa el ratón sobre un icono para ver su nombre.\n- Haz clic en el aserradero.\n- Colócalo en un punto verde o amarillo al noreste de la cabaña de leñador.
tutorial-task-4 = No solo necesitas tablones, sino también piedras para construir.\n\nPor eso, levanta una cabaña de cantero al oeste del campo de piedra en el este.
tutorial-task-5 = Para ampliar y proteger tu territorio debes construir torres de vigilancia.\n- Abre el menú "Edificios militares" (el icono de torre).\n- Haz clic en el icono de la torre de vigilancia.\n- Construye una en el extremo oeste, una en el norte y una en el este.\n\nEn cuanto una torre esté terminada, un espadachín la ocupará y tu territorio se ampliará.
tutorial-task-6 = Para conseguir más colonos, construye casas de vivienda.\n- Abre el menú "Edificios varios".\n- Levanta una casa pequeña al sur de tu torre de partida.\n\nPara que a tu leñador no se le acaben los árboles, construye una casa forestal al suroeste de él (menú "Edificios para recursos").\n\nUn poco al oeste de la casa forestal sigue una segunda cabaña de leñador.\n\nUn guardabosques planta suficientes árboles para dos leñadores.
tutorial-task-7 = En el norte, una cordillera ha entrado en tu campo de visión gracias a la expansión del territorio.\n\nRecluta 5 geólogos:\n- Abre el menú COLONOS / ELECCIÓN DE PROFESIÓN.\n- Haz clic en la doble flecha del especialista arriba a la izquierda.\n- Arrastra un recuadro alrededor de los cinco geólogos con el botón izquierdo del ratón.\n\nEnvía a los geólogos a las montañas. Solo encuentran recursos en terreno rocoso.\n\nHaz clic en "Buscar recursos" a la izquierda y déjalos explorar la montaña hasta que hayan encontrado mineral de hierro (símbolos plateados) y carbón (símbolos negros).\n\nConstruye minas en los puntos con más símbolos (menú "Edificios para recursos").
tutorial-task-8 = Construye cerca de la montaña una fundición de hierro, una herrería de herramientas y una herrería de armas.\n\nAquí las rutas de suministro cortas son más importantes que el tiempo de construcción: usa también los campos rojos.\n\nPara las próximas construcciones necesitas más colonos: construye otra casa de vivienda, si es posible una mediana, al oeste de la casa pequeña.\n\nLa herrería de armas trabaja automáticamente. Las herramientas se fabrican mediante el menú "Mercancías y herramientas / Herramientas y armas".
tutorial-task-9 = Tus mineros necesitan una industria alimentaria. En el este hay suficiente espacio.\n\nPartes: granja de cereales, granja de cerdos, matadero, planta de agua.\n\n- Construye la granja de cereales. El granjero necesita terreno llano y verde al sur de su granja.\n- Justo al lado va la granja de cerdos, no sobre la zona de cultivo.\n- El matadero está en línea directa entre la granja de cerdos y las minas.\n- Encuentra el río en el oeste. La planta de agua debe estar sobre agua corriente.\n\nSelecciona la planta de agua y haz clic en el interruptor con los círculos naranja-verdes. El área de trabajo debe incluir agua corriente.
tutorial-task-10 = La segunda parte de la industria alimentaria es la producción de pan.\n\nLa torre de vigilancia en el extremo este bloquea tierra de cultivo fértil:\n- Selecciona la torre.\n- Haz clic en "Demoler edificio" (arriba a la derecha del todo en el menú de edificios).\n- Confirma con "Sí".\n\nDespués construye una segunda granja de cereales, un molino de viento y una panadería cerca de las minas.
tutorial-task-11 = Ahora deberías reclutar soldados. Para ello necesitas un cuartel en la frontera oeste.\n\nCuando esté terminado, se le entregarán armas que los colonos belicosos cogerán y se convertirán en soldados.\n\nPara tener suficientes soldados necesitas más población: construye otra casa de vivienda mediana al este de la casa pequeña.
tutorial-task-12 = ¿Te interesa lo que se esconde en la oscuridad del mundo? Entonces recluta un ladrón.\n\nReclutas un ladrón donde también reclutas geólogos:\n- Haz clic en la flecha simple del especialista abajo a la izquierda.\n- Necesitas porteadores libres en la pantalla.\n\nEnvía al ladrón hacia el norte y observa cómo se disipa la niebla de guerra.\n\nDebe tener cuidado: demasiado cerca de soldados enemigos sería descubierto y neutralizado.\n\nIntenta encontrar la torre enemiga.
tutorial-task-13 = Antes de atacar, expande tu territorio hacia el oeste hasta que tus fronteras incluyan los lingotes de oro. El oro fortalece el poder de combate de tus soldados en territorio enemigo.\n\nSi una torre de vigilancia no está ocupada, envía un espadachín. Puedes demoler torres ocupadas para liberar un espadachín.\n\nRecluta al menos 15 soldados y marcha hacia el norte hasta la torre enemiga.\n\nCuando todos los guerreros hayan llegado (los arqueros caminan más lento) y estén seleccionados, haz clic con el botón derecho en la torre enemiga.
tutorial-task-14 = Enhorabuena. Eres realmente uno de los elegidos.\n\nAhora estás listo para conquistar el mundo. Buena suerte. La necesitarás.\n\nHaz clic en el icono de ordenador en la esquina inferior izquierda.\n\n¡Que te diviertas!
