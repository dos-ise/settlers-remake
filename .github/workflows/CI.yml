name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Version for the native packages (e.g. 0.7.0.0)'
        required: false
        default: '0.7.0.0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - uses: jonasb/android-problem-matchers-action@v1
    - uses: gradle/actions/setup-gradle@v4
    - run: ./gradlew release
    - uses: actions/upload-artifact@v4
      with:
        name: Release
        path: 'release/*'

  native:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: JSettlers-windows
            glob: '*.exe'
          - os: ubuntu-latest
            artifact: JSettlers-linux
            glob: '*.deb'
          - os: macos-latest
            artifact: JSettlers-macos
            glob: '*.dmg'
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - uses: gradle/actions/setup-gradle@v4
    - name: Build native package
      shell: bash
      run: |
        VERSION="${{ github.event.inputs.releaseVersion }}"
        if [ -z "$VERSION" ]; then
          VERSION="${GITHUB_REF_NAME#v}"
        fi
        ./gradlew :jsettlers.main.swing:nativePackage -PreleaseVersion="$VERSION" --no-daemon
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: jsettlers.main.swing/build/jpackage/${{ matrix.glob }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: Release
        path: release
    - uses: actions/download-artifact@v4
      with:
        name: JSettlers-windows
        path: release
    - uses: actions/download-artifact@v4
      with:
        name: JSettlers-linux
        path: release
    - uses: actions/download-artifact@v4
      with:
        name: JSettlers-macos
        path: release
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" release/* \
          --title "$GITHUB_REF_NAME" \
          --notes-file RELEASE_NOTES.md

  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - uses: jonasb/android-problem-matchers-action@v1
    - uses: gradle/actions/setup-gradle@v4
    # hardShouldConquerEasy and testIfReplayIsEqualToOriginalPlay are known-broken on master
    # (AI balance regression / replay determinism) and are @Ignore'd until fixed.
    - run: ./gradlew test --info
