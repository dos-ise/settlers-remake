name: CI

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    - uses: jonasb/android-problem-matchers-action@v1
    - uses: gradle/gradle-build-action@v3
      with:
        arguments: release
    - name: Create draft release with APK
      if: success() && github.event_name == 'push'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        APK="jsettlers.main.android/build/outputs/apk/debug/jsettlers.main.android-debug.apk"
        if [ ! -f "$APK" ]; then
          echo "APK not found, skipping release"
          exit 0
        fi
        TAG="android-${GITHUB_SHA::8}-$(date +%s)"
        gh release create "$TAG" "$APK" \
          --draft \
          --title "JSettlers Android build (${GITHUB_SHA::8})" \
          --notes "Automated Android build from commit ${GITHUB_SHA}." || echo "Release creation failed"
    - name: Debug gradle failure
      if: failure()
      shell: bash
      run: |
        set +e
        ./gradlew release --stacktrace > /tmp/gradle-full.txt 2>&1
        {
          echo "## Gradle diagnostics"
          echo '```'
          grep -n -B 2 -A 8 "error:" /tmp/gradle-full.txt | head -150
          echo '--- tail ---'
          tail -30 /tmp/gradle-full.txt
          echo '```'
        } > /tmp/comment.md
        cat /tmp/comment.md >> $GITHUB_STEP_SUMMARY
        gh pr comment 5 --body-file /tmp/comment.md 2>&1 | head -5 || true
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/upload-artifact@v4
      with:
        name: Release
        path: 'release/*'

  tests:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    - uses: jonasb/android-problem-matchers-action@v1
    - uses: gradle/gradle-build-action@v3
      with:
        arguments: test --info
    - name: Debug tests failure
      if: failure()
      shell: bash
      run: |
        set +e
        {
          echo "## Tests diagnostics"
          echo '```'
          echo "--- failing test XML files ---"
          FOUND=0
          while IFS= read -r f; do
            if grep -q 'failures="[1-9]\|errors="[1-9]' "$f"; then
              FOUND=1
              echo "=== $f ==="
              grep -o 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' "$f" | head -3
              grep -A 8 '<failure\|<error' "$f" | head -60
            fi
          done < <(find . -path '*/build/test-results/test/*.xml' -name 'TEST-*.xml' 2>/dev/null)
          if [ "$FOUND" = "0" ]; then
            echo "No failing test XML found. Re-running gradle test to capture error..."
            ./gradlew test --info > /tmp/tests-full.txt 2>&1
            grep -n -B 2 -A 8 "error:\|FAILED\|AssertionError" /tmp/tests-full.txt | head -150
            echo '--- tail ---'
            tail -30 /tmp/tests-full.txt
          fi
          echo '```'
        } > /tmp/comment.md
        cat /tmp/comment.md >> $GITHUB_STEP_SUMMARY
        gh pr comment 5 --body-file /tmp/comment.md 2>&1 | head -5 || true
      env:
        GH_TOKEN: ${{ github.token }}
