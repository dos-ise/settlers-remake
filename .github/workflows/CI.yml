name: CI

on:
  pull_request:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - uses: jonasb/android-problem-matchers-action@v1
    - uses: gradle/actions/setup-gradle@v4
    - run: ./gradlew release
    - uses: actions/upload-artifact@v4
      with:
        name: Release
        path: 'release/*'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: Release
        path: release
    - name: Create GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" release/* \
          --title "$GITHUB_REF_NAME" \
          --notes-file RELEASE_NOTES.md

  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - uses: jonasb/android-problem-matchers-action@v1
    - uses: gradle/actions/setup-gradle@v4
    # hardShouldConquerEasy and testIfReplayIsEqualToOriginalPlay are known-broken on master
    # (AI balance regression / replay determinism) and are @Ignore'd until fixed.
    - run: ./gradlew test --info
