name: CI

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - uses: jonasb/android-problem-matchers-action@v1
    - uses: gradle/actions/setup-gradle@v4
    - run: ./gradlew release
    - name: Create draft release with APK
      if: success() && github.event_name == 'push'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        APK="jsettlers.main.android/build/outputs/apk/debug/jsettlers.main.android-debug.apk"
        if [ ! -f "$APK" ]; then
          echo "APK not found, skipping release"
          exit 0
        fi
        TAG="android-${GITHUB_SHA::8}-$(date +%s)"
        gh release create "$TAG" "$APK" \
          --draft \
          --title "JSettlers Android build (${GITHUB_SHA::8})" \
          --notes "Automated Android build from commit ${GITHUB_SHA}." || echo "Release creation failed"
    - uses: actions/upload-artifact@v4
      with:
        name: Release
        path: 'release/*'

  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - uses: jonasb/android-problem-matchers-action@v1
    - uses: gradle/actions/setup-gradle@v4
    # hardShouldConquerEasy and testIfReplayIsEqualToOriginalPlay are known-broken on master
    # (AI balance regression / replay determinism) and are @Ignore'd until fixed.
    - run: ./gradlew test --info
