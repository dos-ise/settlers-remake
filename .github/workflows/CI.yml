name: CI

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - uses: jonasb/android-problem-matchers-action@v1
    - uses: gradle/actions/setup-gradle@v4
    - run: ./gradlew release
    - uses: actions/upload-artifact@v4
      with:
        name: Release
        path: 'release/*'

  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
    - uses: jonasb/android-problem-matchers-action@v1
    - uses: gradle/actions/setup-gradle@v4
    # hardShouldConquerEasy and testIfReplayIsEqualToOriginalPlay are known-broken on master
    # (AI balance regression / replay determinism) and are @Ignore'd until fixed.
    - run: ./gradlew test --info
