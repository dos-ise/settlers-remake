name: CI

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    - uses: jonasb/android-problem-matchers-action@v1
    - uses: gradle/gradle-build-action@v3
      with:
        arguments: release
    - name: Debug gradle failure
      if: failure()
      shell: bash
      run: |
        set +e
        ./gradlew release --stacktrace > /tmp/gradle-full.txt 2>&1
        {
          echo "## Gradle diagnostics"
          echo '```'
          grep -n -B 2 -A 8 "error:\|FAILED\|What went wrong\|Caused by" /tmp/gradle-full.txt | head -120
          echo '--- tail ---'
          tail -30 /tmp/gradle-full.txt
          echo '```'
        } > /tmp/comment.md
        cat /tmp/comment.md >> $GITHUB_STEP_SUMMARY
        gh pr comment 11 --body-file /tmp/comment.md 2>&1 | head -5 || true
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Create draft release with APK
      if: success() && github.event_name == 'push'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        APK="jsettlers.main.android/build/outputs/apk/debug/jsettlers.main.android-debug.apk"
        if [ ! -f "$APK" ]; then
          echo "APK not found, skipping release"
          exit 0
        fi
        TAG="android-${GITHUB_SHA::8}-$(date +%s)"
        gh release create "$TAG" "$APK" \
          --draft \
          --title "JSettlers Android build (${GITHUB_SHA::8})" \
          --notes "Automated Android build from commit ${GITHUB_SHA}." || echo "Release creation failed"
    - uses: actions/upload-artifact@v4
      with:
        name: Release
        path: 'release/*'

  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    - uses: jonasb/android-problem-matchers-action@v1
    - uses: gradle/gradle-build-action@v3
      with:
        # hardShouldConquerEasy and testIfReplayIsEqualToOriginalPlay are known-broken on master
        # (AI balance regression / replay determinism) and are @Ignore'd until fixed.
        arguments: test --info
