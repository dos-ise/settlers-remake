name: CI

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    - uses: jonasb/android-problem-matchers-action@v1
    - uses: gradle/gradle-build-action@v3
      with:
        arguments: release
    - name: Debug gradle failure
      if: failure()
      shell: bash
      run: |
        set +e
        {
          echo "## Gradle diagnostics"
          echo '```'
          ./gradlew --version 2>&1 | head -20
          echo '---'
          ./gradlew release --stacktrace 2>&1 | tail -200
          echo '```'
        } > /tmp/comment.md
        cat /tmp/comment.md >> $GITHUB_STEP_SUMMARY
        gh pr comment 5 --body-file /tmp/comment.md || true
      env:
        GH_TOKEN: ${{ github.token }}
    - uses: actions/upload-artifact@v4
      with:
        name: Release
        path: 'release/*'

  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'
    - uses: jonasb/android-problem-matchers-action@v1
    - uses: gradle/gradle-build-action@v3
      with:
        arguments: test --info
